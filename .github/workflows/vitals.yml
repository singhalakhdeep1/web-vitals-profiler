name: Web Vitals CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            https://example.com
            https://example.com/about
          uploadArtifacts: true
          temporaryPublicStorage: true
          
      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v3
        with:
          name: lighthouse-results
          path: .lighthouseci

  vitals-collection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Collect vitals
        run: npm run collect:vitals
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          
      - name: Upload vitals data
        uses: actions/upload-artifact@v3
        with:
          name: vitals-data
          path: vitals-data

  analyze:
    runs-on: ubuntu-latest
    needs: [lighthouse, vitals-collection]
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Lighthouse results
        uses: actions/download-artifact@v3
        with:
          name: lighthouse-results
          
      - name: Download vitals data
        uses: actions/download-artifact@v3
        with:
          name: vitals-data
          
      - name: Analyze results
        run: npm run analyze:vitals
        
      - name: Generate report
        run: npm run report:vitals
        
      - name: Upload report
        uses: actions/upload-artifact@v3
        with:
          name: vitals-report
          path: reports
